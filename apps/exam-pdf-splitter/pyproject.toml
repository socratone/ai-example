[project]
name = "exam-pdf-splitter"
version = "0.1.0"
description = "Split exam PDFs into question PNGs"
requires-python = ">=3.12,<3.13"
dependencies = ["pymupdf>=1.26,<2", "pillow>=11,<14"]

[project.scripts]
exam-pdf-splitter = "exam_pdf_splitter.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
