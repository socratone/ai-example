[project]
name = "exam-question-reviewer"
version = "0.1.0"
description = "Review exam question images for errors"
requires-python = ">=3.12,<3.13"
dependencies = ["modal>=1,<2", "pillow>=11,<14", "pydantic>=2,<3"]

[project.scripts]
exam-question-reviewer = "exam_question_reviewer.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
